name: CI
on:
  pull_request:
  push: { branches: [main] }
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "16.2" }
      - name: Homebrew deps
        run: brew install cmake gperf openssl@3
      - name: Cache TDLib
        id: tdlib
        uses: actions/cache@v4
        with:
          path: Vendor/tdlib/lib
          key: tdlib-d1085f9-${{ runner.os }}-${{ runner.arch }}
      - name: Build TDLib
        if: steps.tdlib.outputs.cache-hit != 'true'
        run: ./Scripts/build-tdlib.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test --skip EvalTests
